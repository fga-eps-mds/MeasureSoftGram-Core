name: Rodar Testes

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.10"
          cache: pip

      - name: Instalar dependências
        run: |
          pip install -r requirements.txt
          pip install tox flake8 black build

      - name: Linter e Sintaxe
        run: |
          black --check src tests
          flake8 .
          python -m compileall -q src tests

      - name: Empacotamento
        run: |
          python -m pip install build
          python -m build

      - name: Rodar testes
        run: tox -e test_core

      - name: Corrige reports path
        run: |
          sed -i "s#<source>${GITHUB_WORKSPACE}</source>#<source>/github/workspace</source>#g" coverage.xml 2>/dev/null || true

      - name: Scanner do SonarCloud
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.projectKey=${{ github.repository_owner }}_${{ github.event.repository.name }}

      - name: Notificação de SonarCloud ignorado (PR cross-repo sem segredos)
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
        run: |
          echo "::notice::PR cross-repository detectado (secrets bloqueados pelo GitHub). Testes concluídos com sucesso; análise estática será consolidada no push da branch principal."
