name: Rodar Testes

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.10"
          cache: pip

      - name: Instalar requirements
        run: pip install -r requirements.txt

      - name: Instalar tox
        run: pip install tox

      - name: Rodar testes
        run: tox

      - name: Corrige reports path
        run: |
          sed -i "s#<source>${GITHUB_WORKSPACE}</source>#<source>/github/workspace</source>#g" coverage.xml

      - name: Gerar metadados do PR / Execução
        run: |
          mkdir -p pr_metadata
          cat << 'EOF' > pr_metadata/metadata.json
          {
            "event_name": "${{ github.event_name }}",
            "pr_number": "${{ github.event.pull_request.number }}",
            "head_ref": "${{ github.event.pull_request.head.ref || github.ref_name }}",
            "head_repo": "${{ github.event.pull_request.head.repo.full_name || github.repository }}",
            "head_sha": "${{ github.event.pull_request.head.sha || github.sha }}",
            "base_ref": "${{ github.event.pull_request.base.ref || github.ref_name }}"
          }
          EOF

      - name: Upload de artefatos de cobertura e metadados
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-coverage-artifacts
          path: |
            coverage.xml
            junit.xml
            pr_metadata/metadata.json
          retention-days: 1

      - name: Scanner do SonarCloud (Fallback para contexto com secrets)
        if: env.SONAR_TOKEN != ''
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.projectKey=${{ github.repository_owner }}_${{ github.event.repository.name }}

      - name: Notificação de SonarCloud desacoplado
        if: env.SONAR_TOKEN == ''
        run: |
          echo "::notice::SONAR_TOKEN não disponível neste contexto (PR de fork). Testes concluídos com sucesso e artefatos (coverage.xml e junit.xml) salvos para a esteira do SonarCloud."
