name: Rodar Testes

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: "3.10"
          cache: pip

      - name: Instalar dependências
        run: |
          pip install -r requirements.txt
          pip install tox flake8 black build

      - name: Linter e Sintaxe
        run: |
          black --check src tests
          flake8 .
          python -m compileall -q src tests

      - name: Empacotamento
        run: |
          python -m pip install build
          python -m build

      - name: Rodar testes
        run: tox -e test_core

      - name: Corrige reports path
        run: |
          sed -i "s#<source>${GITHUB_WORKSPACE}</source>#<source>/github/workspace</source>#g" coverage.xml 2>/dev/null || true

      - name: Scanner do SonarCloud
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: SonarSource/sonarqube-scan-action@ba9859eae8dd6bd29e412f25ddbbef3d032000f4 # v8.2.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.projectKey=${{ github.repository_owner }}_${{ github.event.repository.name }}

      - name: Notificação de SonarCloud ignorado (PR cross-repo sem segredos)
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
        run: |
          echo "::notice::PR cross-repository detectado (secrets bloqueados pelo GitHub). Testes concluídos com sucesso; análise estática será consolidada no push da branch principal."
