name: SonarCloud Scan

on:
  workflow_run:
    workflows: ["Rodar Testes"]
    types: [completed]

jobs:
  sonarcloud:
    name: SonarCloud Analysis
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'success'
    permissions:
      actions: read
      contents: read
      pull-requests: write
      checks: write
      statuses: write

    steps:
      - name: Baixar artefatos de cobertura e metadados
        uses: actions/download-artifact@v4
        with:
          name: test-coverage-artifacts
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}
          path: ${{ runner.temp }}/artifacts

      - name: Extrair metadados da execução
        id: meta
        run: |
          EVENT_NAME=$(jq -r '.event_name' "${{ runner.temp }}/artifacts/pr_metadata/metadata.json")
          PR_NUMBER=$(jq -r '.pr_number' "${{ runner.temp }}/artifacts/pr_metadata/metadata.json")
          HEAD_REF=$(jq -r '.head_ref' "${{ runner.temp }}/artifacts/pr_metadata/metadata.json")
          HEAD_REPO=$(jq -r '.head_repo' "${{ runner.temp }}/artifacts/pr_metadata/metadata.json")
          HEAD_SHA=$(jq -r '.head_sha' "${{ runner.temp }}/artifacts/pr_metadata/metadata.json")
          BASE_REF=$(jq -r '.base_ref' "${{ runner.temp }}/artifacts/pr_metadata/metadata.json")

          echo "event_name=$EVENT_NAME" >> "$GITHUB_OUTPUT"
          echo "pr_number=$PR_NUMBER" >> "$GITHUB_OUTPUT"
          echo "head_ref=$HEAD_REF" >> "$GITHUB_OUTPUT"
          echo "head_repo=$HEAD_REPO" >> "$GITHUB_OUTPUT"
          echo "head_sha=$HEAD_SHA" >> "$GITHUB_OUTPUT"
          echo "base_ref=$BASE_REF" >> "$GITHUB_OUTPUT"

      - name: Checkout do código do commit analisado
        uses: actions/checkout@v4
        with:
          repository: ${{ steps.meta.outputs.head_repo }}
          ref: ${{ steps.meta.outputs.head_sha }}
          fetch-depth: 0
          allow-unsafe-pr-checkout: true

      - name: Restaurar relatórios para a raiz do workspace
        run: |
          cp "${{ runner.temp }}/artifacts/coverage.xml" ./coverage.xml 2>/dev/null || true
          cp "${{ runner.temp }}/artifacts/junit.xml" ./junit.xml 2>/dev/null || true

      - name: SonarCloud Scan (Pull Request)
        if: steps.meta.outputs.event_name == 'pull_request' && steps.meta.outputs.pr_number != '' && steps.meta.outputs.pr_number != 'null'
        uses: SonarSource/sonarqube-scan-action@ba9859eae8dd6bd29e412f25ddbbef3d032000f4 # v8.2.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.projectKey=${{ github.repository_owner }}_${{ github.event.repository.name }}
            -Dsonar.organization=fga-eps-mds-1
            -Dsonar.pullrequest.key=${{ steps.meta.outputs.pr_number }}
            -Dsonar.pullrequest.branch=${{ steps.meta.outputs.head_ref }}
            -Dsonar.pullrequest.base=${{ steps.meta.outputs.base_ref }}
            -Dsonar.scm.revision=${{ steps.meta.outputs.head_sha }}

      - name: SonarCloud Scan (Push na Branch)
        if: steps.meta.outputs.event_name == 'push'
        uses: SonarSource/sonarqube-scan-action@ba9859eae8dd6bd29e412f25ddbbef3d032000f4 # v8.2.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.projectKey=${{ github.repository_owner }}_${{ github.event.repository.name }}
            -Dsonar.organization=fga-eps-mds-1
            -Dsonar.branch.name=${{ steps.meta.outputs.head_ref }}
