name: Release Oficial Python

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  id-token: write # Necessário para Trusted Publishing (OIDC) no PyPI

jobs:
  release-please:
    # Publicação só no repositório central; nos forks semestrais o job é pulado.
    if: github.repository == 'fga-eps-mds/MeasureSoftGram-Core'
    runs-on: ubuntu-latest
    environment: pypi
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          release-type: python
          target-branch: main

      - name: Checkout do código pós-release
        if: ${{ steps.release.outputs.release_created }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python
        if: ${{ steps.release.outputs.release_created }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Instalar dependências de build e validação
        if: ${{ steps.release.outputs.release_created }}
        run: python -m pip install --upgrade pip build twine packaging

      - name: Compilar distribuição (sdist e wheel)
        if: ${{ steps.release.outputs.release_created }}
        run: |
          python -m build
          python -m twine check dist/*

      - name: Gate de Segurança PyPI (Versão Superior e Pré-Releases)
        if: ${{ steps.release.outputs.release_created }}
        env:
          TARGET_VERSION: ${{ steps.release.outputs.version }}
        run: |
          python - <<'PY'
          import json, os, sys, urllib.request, urllib.error
          from packaging.version import Version

          target_version_str = os.environ.get("TARGET_VERSION", "")
          if not target_version_str:
              print("::error::TARGET_VERSION nao definida.")
              sys.exit(1)

          target_version = Version(target_version_str)
          pkg = "msgram-core"
          url = f"https://pypi.org/pypi/{pkg}/json"

          try:
              with urllib.request.urlopen(url, timeout=30) as r:
                  data = json.load(r)
          except urllib.error.HTTPError as e:
              print(f"::error::Nao foi possivel consultar o PyPI ({e.code}).")
              sys.exit(1)

          all_releases = [Version(v) for v in data.get("releases", {}).keys()]
          stable_releases = sorted([v for v in all_releases if not v.is_prerelease])

          # Regra 1: Versao estritamente superior a ultima estavel no PyPI
          if stable_releases:
              latest_stable = stable_releases[-1]
              print(f"Ultima versao estavel no PyPI: {latest_stable}")
              print(f"Versao alvo: {target_version}")
              if target_version <= latest_stable:
                  print(f"::error::Gate bloqueou a publicacao: a versao alvo ({target_version}) "
                        f"deve ser estritamente superior a versao estavel atual no PyPI ({latest_stable}).")
                  sys.exit(1)
          else:
              print("Nenhuma versao estavel anterior encontrada no PyPI.")

          # Regra 2: Ja existe ao menos uma release candidate (rc) da mesma versao base no PyPI
          base_version = target_version.base_version
          rcs = sorted(
              v for v in data.get("releases", {})
              if Version(v).base_version == base_version and Version(v).is_prerelease
          )
          if not rcs:
              print(f"::error::Gate bloqueou a publicacao da versao final: nenhuma "
                    f"release candidate de {base_version} encontrada no PyPI. Crie e homologue "
                    f"a tag v{base_version}rc1 antes de publicar a versao final.")
              sys.exit(1)
          print(f"Gate ok: release candidate(s) encontrada(s) no PyPI para {base_version}: {rcs}")
          print("Todas as validacoes do Gate de Seguranca PyPI foram aprovadas com sucesso!")
          PY

      - name: Anexar artefatos à GitHub Release oficial
        if: ${{ steps.release.outputs.release_created }}
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ steps.release.outputs.tag_name }}
          files: dist/*

      - name: Publicar no PyPI oficial via Trusted Publishing (OIDC)
        if: ${{ steps.release.outputs.release_created }}
        uses: pypa/gh-action-pypi-publish@76f52bc884231f62b9a034ebfe128415bbaabdfc # v1.12.4
