name: Release Oficial Python

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write
  id-token: write # Necessário para Trusted Publishing (OIDC) no PyPI

jobs:
  release-please:
    runs-on: ubuntu-latest
    environment: pypi
    steps:
      - uses: googleapis/release-please-action@a02a34c4d625f9be7cb89156071d8567266a2445 # v4.2.0
        id: release
        with:
          release-type: python
          target-branch: main

      - name: Checkout do código pós-release
        if: ${{ steps.release.outputs.release_created }}
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Python
        if: ${{ steps.release.outputs.release_created }}
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.12"

      - name: Instalar dependências de build
        if: ${{ steps.release.outputs.release_created }}
        run: python -m pip install --upgrade pip build twine

      - name: Compilar distribuição (sdist e wheel)
        if: ${{ steps.release.outputs.release_created }}
        run: |
          python -m build
          python -m twine check dist/*

      - name: Anexar artefatos à GitHub Release oficial
        if: ${{ steps.release.outputs.release_created }}
        uses: softprops/action-gh-release@c062e08bd532815e2082a85e87e3ef29c3e6d191 # v2.0.8
        with:
          tag_name: ${{ steps.release.outputs.tag_name }}
          files: dist/*

      - name: Publicar no PyPI oficial via Trusted Publishing (OIDC)
        if: ${{ steps.release.outputs.release_created }}
        uses: pypa/gh-action-pypi-publish@76f52e663a01b56fe7666a29bd44447b0cc80a41 # v1.12.4
